# The push map on hosted runners (plan docs/superpowers/plans/2026-10-29-p2b2b2c3b-push-map.md, Task B5; design A7 item
# 11). Started by hand only, and removed once the envelope is resolved (Task B9).
name: Push map

on:
    workflow_dispatch:
        inputs:
            types:
                description: Shot types, comma-separated, or all
                default: all
                required: true
            stage:
                description: 1 is each text book alone, 2 the full map
                type: choice
                options: ["1", "2"]
                default: "1"
                required: true
            shards:
                description: Jobs shared among the types by their plans, each running four shards
                default: "6"
                required: true
            lawns:
                description: Lawns (s), comma-separated; empty is all the grid's
                default: ""
                required: false
            only:
                description: all, or one job's number per type, which leaves the map unmerged (timing, a repeat)
                default: all
                required: true

permissions:
    contents: read

env:
    STAGE: ${{ inputs.stage }}
    LAWNS: ${{ inputs.lawns }}

# Named, so that pipefail is on: merge's tee must not hide a dead shard.
defaults:
    run:
        shell: bash

jobs:
    plan:
        runs-on: ubuntu-26.04
        timeout-minutes: 15
        outputs:
            matrix: ${{ steps.matrix.outputs.matrix }}
            types: ${{ steps.matrix.outputs.types }}
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - id: matrix
              run: npx --no-install tsx scripts/pushMap.ts
              env:
                  SECTION: matrix
                  TYPES: ${{ inputs.types }}
                  SHARDS: ${{ inputs.shards }}
                  ONLY: ${{ inputs.only }}

    shard:
        needs: plan
        name: ${{ matrix.type }} ${{ matrix.job }} of ${{ matrix.jobs }}
        runs-on: ubuntu-26.04
        # Six hours is GitHub's limit on a job. The shards stop first, so what they have written is still uploaded.
        timeout-minutes: 350
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.plan.outputs.matrix) }}
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - name: Play the job's four shards
              timeout-minutes: 335
              env:
                  SECTION: run
                  TYPE: ${{ matrix.type }}
                  JOB: ${{ matrix.job }}
                  JOBS: ${{ matrix.jobs }}
              run: |
                  mkdir -p shards
                  pids=()
                  # A hosted runner has four vCPUs (design A7 item 11).
                  for worker in 0 1 2 3; do
                      k=$((JOB * 4 + worker))
                      n=$((JOBS * 4))
                      SHARD="$k/$n" OUT="shards/$TYPE-${k}of$n.jsonl" npx --no-install tsx scripts/pushMap.ts &
                      pids+=("$!")
                  done
                  status=0
                  for pid in "${pids[@]}"; do
                      wait "$pid" || status=1
                  done
                  exit "$status"
            - uses: actions/upload-artifact@v7
              if: ${{ !cancelled() }}
              with:
                  name: shard-${{ matrix.type }}-${{ matrix.job }}of${{ matrix.jobs }}
                  path: shards/*.jsonl
                  if-no-files-found: warn

    merge:
        needs: [plan, shard]
        if: ${{ !cancelled() && inputs.only == 'all' && needs.plan.result == 'success' }}
        runs-on: ubuntu-26.04
        timeout-minutes: 120
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - uses: actions/download-artifact@v8
              with:
                  pattern: shard-*
                  path: shards
                  merge-multiple: true
            - name: Merge each type
              env:
                  SECTION: merge
                  IN: shards
                  TYPES: ${{ needs.plan.outputs.types }}
              run: |
                  status=0
                  for type in $TYPES; do
                      TYPE="$type" npx --no-install tsx scripts/pushMap.ts 2>&1 | tee "shards/$type.merge.txt" || status=1
                  done
                  # On the same runners as the map, as gate stage 1's figures must be (design A7 item 11).
                  if [ "$STAGE" = "1" ]; then
                      SECTION=stage1 npx --no-install tsx scripts/pushMap.ts 2>&1 | tee shards/stage1.txt || status=1
                  fi
                  exit "$status"
            - uses: actions/upload-artifact@v7
              if: ${{ !cancelled() }}
              with:
                  name: merged
                  path: |
                      shards/*.reads.json
                      shards/*.merge.txt
                      shards/stage1.txt
                  if-no-files-found: error
