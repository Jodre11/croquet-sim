name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-26.04
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run format:check
            - run: npm run check
            # The runners beside the slow suite run tests 2–4× slower than locally, and over 2× slower from run to
            # run, so the default timeout is 4× the local one (vite.config.ts).
            - run: npm test -- --testTimeout=60000
            - run: npm run build
